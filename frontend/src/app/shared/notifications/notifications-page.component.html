<div class="page-head">
  <div>
    <p class="page-kicker">Inbox</p>
    <h1 class="page-title">Notifications</h1>
  </div>
</div>

@if (loading) {
  <p class="page-lead">Loading…</p>
} @else if (items.length === 0) {
  <p class="page-lead">No notifications yet.</p>
} @else {
  <div class="card card-pad">
    <div class="list">
      @for (n of items; track n.id) {
        <button type="button" class="list-item" [class.list-group-item-light]="!n.read" (click)="open(n)">
          <div class="avatar sm">N</div>
          <div style="flex: 1; text-align: left">
            <div class="d-flex justify-content-between align-items-start">
              <div class="title">{{ n.title }}</div>
              <span class="small text-muted">{{ formatInstant(n.createdAt) }}</span>
            </div>
            <div class="sub">{{ n.body }}</div>
            @if (!n.read) {
              <span class="badge badge-primary mt-1">Unread</span>
            }
          </div>
        </button>
      }
    </div>
  </div>
}
