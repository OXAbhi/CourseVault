spring.application.name=learning-portal
spring.config.import=optional:classpath:application-local.properties

# MySQL — set DB_* or use application-local.properties (not committed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learning_portal?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Cloudinary — required in production; set env vars or application-local.properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JWT — use a long random JWT_SECRET in production (min 32 characters)
jwt.secret=${JWT_SECRET:local-dev-only-replace-with-env-var-min-32-chars}
jwt.expiration-ms=86400000

# Comma-separated origins for the Angular app (add your Vercel URL when deploying)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}